[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-research-template"
version = "0.1.0"
description = "An AI-friendly research project template for reproducible, multi-dataset experiments"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
  {name = "Le Xuan Thang", email = "lexuanthang.official@outlook.com"},
]
requires-python = ">=3.10"
dependencies = []

[project.urls]
Repository = "https://github.com/Le-Xuan-Thang/ai-research-template"
Documentation = "https://github.com/Le-Xuan-Thang/ai-research-template/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]
